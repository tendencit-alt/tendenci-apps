name: Instaladores

# Gera o .exe (Windows) e o .dmg (macOS) do TENDENCI e publica na
# release "latest" deste repositorio. Os arquivos ficam com URL fixa:
# https://github.com/tendencit-alt/tendenci-apps/releases/latest/download/TENDENCI-Setup.exe
# https://github.com/tendencit-alt/tendenci-apps/releases/latest/download/TENDENCI.dmg
#
# O app e apenas um shell que abre www.tendencitech.com.br, entao todo
# deploy do Vercel chega no usuario sem precisar reinstalar nada.
# Repositorio publico: nenhum secret e necessario (usa o GITHUB_TOKEN).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app-shell/**"
      - ".github/workflows/instaladores.yml"

permissions:
  contents: write

jobs:
  icone:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar icone 1024x1024 a partir do site
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p icons
          # icon-512.png e um PNG de verdade. O favicon.svg e so um wrapper
          # com <image href="data:..."> dentro, e o rsvg-convert perdia o
          # desenho e gerava um icone quebrado (so o traco azul aparecia).
          curl -sSfL -o icons/base.png https://www.tendencitech.com.br/icon-512.png
          convert icons/base.png -resize 1024x1024 -background none \
            -gravity center -extent 1024x1024 icons/icon.png
          identify icons/icon.png
      - uses: actions/upload-artifact@v4
        with:
          name: icone
          path: icons/icon.png

  windows:
    needs: icone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: icone
          path: app-shell/icons
      - name: Build do instalador .exe
        working-directory: app-shell
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: app-shell/dist/TENDENCI-Setup.exe

  macos:
    needs: icone
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: icone
          path: app-shell/icons

      - name: Empacotar o .app universal
        working-directory: app-shell
        run: |
          set -eo pipefail
          npm install --no-audit --no-fund
          npx electron-builder --mac dir --universal --publish never
          find dist -maxdepth 2 -name "*.app" -print

      # O lipo que junta x64 + arm64 deixa o binario final sem assinatura
      # valida. No Apple Silicon isso faz o Gatekeeper acusar "Malware
      # Bloqueado". A assinatura ad-hoc (--sign -) tira o bloqueio duro.
      # O aviso de "desenvolvedor nao identificado" so some com um
      # certificado Apple Developer ID + notarizacao (US$ 99/ano).
      # O .dmg e montado na mao com hdiutil para nao correr o risco do
      # electron-builder reempacotar e derrubar a assinatura.
      - name: Assinar o app (ad-hoc) e gerar o .dmg
        working-directory: app-shell
        run: |
          set -eo pipefail
          APP="$(find dist -maxdepth 2 -name 'TENDENCI.app' -print -quit)"
          echo "app: $APP"
          xattr -cr "$APP"
          codesign --remove-signature "$APP" || true
          codesign --force --deep --timestamp=none --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" || echo "AVISO: verify reclamou"
          codesign --display --verbose=2 "$APP" || true
          rm -rf dmgroot
          mkdir -p dmgroot
          ditto "$APP" "dmgroot/TENDENCI.app"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname TENDENCI -srcfolder dmgroot -ov -format UDZO dist/TENDENCI.dmg
          ls -la dist/TENDENCI.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-macos
          path: app-shell/dist/TENDENCI.dmg

  publicar:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: instalador-windows
          path: saida
      - uses: actions/download-artifact@v4
        with:
          name: instalador-macos
          path: saida
      - name: Publicar na release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          ls -la saida
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest saida/TENDENCI-Setup.exe saida/TENDENCI.dmg \
            --title "TENDENCI - ultima versao" \
            --notes "Instaladores gerados automaticamente em $(date -u +%d/%m/%Y) as $(date -u +%H:%M) UTC." \
            --latest
          gh release view latest --json assets --jq ".assets[].name"
